<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="760" height="380" rx="14" fill="#f3f3f3" stroke="#d0d7de"/>
  <text x="24" y="36" font-size="15" fill="#555">Settings</text>
  <!-- sidebar -->
  <g font-size="14" fill="#1b1f24">
    <text x="40" y="90">🏠  Home</text>
    <text x="40" y="126">🖥  System</text>
    <text x="40" y="162">🔵  Bluetooth &amp; devices</text>
    <text x="40" y="198">🎨  Personalization</text>
    <text x="40" y="234">📦  Apps</text>
    <rect x="28" y="248" width="220" height="34" rx="6" fill="#e3f6ee"/>
    <rect x="28" y="256" width="4" height="18" rx="2" fill="#1baf7a"/>
    <text x="40" y="270" font-weight="600">🌐  Time &amp; language</text>
    <text x="40" y="306">🎮  Gaming</text>
  </g>
  <!-- right -->
  <text x="290" y="90" font-size="24" font-weight="600" fill="#1b1f24">Time &amp; language</text>
  <rect x="290" y="112" width="440" height="52" rx="8" fill="#fff" stroke="#e1e4e8"/>
  <text x="310" y="144" font-size="15" fill="#1b1f24">🕒  Date &amp; time</text>
  <rect x="290" y="172" width="440" height="52" rx="8" fill="#fff" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="310" y="204" font-size="15" font-weight="600" fill="#1b1f24">🔤  Language &amp; region</text>
  <text x="710" y="204" font-size="18" fill="#1b1f24">›</text>
  <rect x="290" y="232" width="440" height="52" rx="8" fill="#fff" stroke="#e1e4e8"/>
  <text x="310" y="264" font-size="15" fill="#1b1f24">⌨  Typing</text>
  <!-- callouts -->
  <circle cx="262" cy="265" r="14" fill="#1baf7a"/><text x="257" y="271" font-size="15" fill="#fff" font-weight="700">1</text>
  <circle cx="742" cy="198" r="14" fill="#1baf7a"/><text x="737" y="204" font-size="15" fill="#fff" font-weight="700">2</text>
  <text x="24" y="360" font-size="13" fill="#6b7280">Open Settings (Win + I) → ① Time &amp; language → ② Language &amp; region</text>
</svg>
