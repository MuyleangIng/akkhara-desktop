[project]
name = "akkhara-desktop"
version = "0.1.0"
description = "Akkhara Desktop (test app): type Sing Khmer, get Khmer in any app on Mac and Windows"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ing Muyleang" }]
dependencies = [
    "onnxruntime>=1.17",
    "numpy",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.scripts]
akkhara-desktop = "akkhara_desktop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["akkhara_desktop"]
